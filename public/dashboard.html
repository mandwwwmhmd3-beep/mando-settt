<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moon Sat — لوحة التحكم</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:Arial}.bar{padding:18px;background:#121a33;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:850px;margin:30px auto;padding:16px}.card{background:#121a33;border:1px solid #29365e;border-radius:18px;padding:22px;margin-bottom:18px}.btn{background:#4f7cff;color:#fff;border:0;border-radius:9px;padding:10px 15px;cursor:pointer}.danger{background:#b7354b}.muted{color:#aeb9d6}.file{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #29365e;padding:12px 0}.upload{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.status{margin-top:12px}.ok{color:#6ee7a2}.err{color:#ff8799}a{color:#8fb0ff}</style></head><body><div class="bar"><b>🌙 Moon Sat</b><div><span id="who"></span> <button class="btn danger" onclick="logout()">تسجيل الخروج</button></div></div><div class="wrap"><div class="card"><h1>لوحة تحكم المالك الرئيسي</h1><div id="health" class="status"></div></div><div class="card"><h2>إدارة الملفات</h2><div class="upload"><input type="file" id="file"><button class="btn" onclick="uploadFile()">رفع ملف</button></div><div id="msg" class="status"></div><div id="files"></div></div></div><script>const token=localStorage.getItem('moonSatToken');if(!token)location.href='/';who.textContent=localStorage.getItem('moonSatUser')||'';const headers=()=>({Authorization:'Bearer '+token});async function api(url,opt={}){opt.headers={...(opt.headers||{}),...headers()};return fetch(url,opt)}async function check(){const r=await fetch('/api/health');const d=await r.json();health.innerHTML=r.ok?(d.storageConfigured?'<span class="ok">● السيرفر والتخزين يعملان</span>':'<span class="err">● السيرفر يعمل، لكن التخزين السحابي غير مُعد</span>'):'<span class="err">السيرفر غير متاح</span>'}async function loadFiles(){const r=await api('/api/files');if(r.status===401)return logout();const d=await r.json();files.innerHTML=r.ok?(d.files||[]).map(f=>`<div class="file"><div><a href="${f.url}" target="_blank">${escapeHtml(f.name)}</a><div class="muted">${format(f.size)}</div></div><button class="btn danger" onclick="del('${encodeURIComponent(f.name)}')">حذف</button></div>`).join('')||'<p class="muted">لا توجد ملفات.</p>':'<p class="err">'+escapeHtml(d.error||'تعذر تحميل الملفات')+'</p>'}async function uploadFile(){const input=document.getElementById('file');if(!input.files[0])return msg.textContent='اختر ملفًا أولًا';const fd=new FormData();fd.append('file',input.files[0]);const r=await api('/api/files',{method:'POST',body:fd});const d=await r.json();msg.textContent=r.ok?'تم رفع الملف بنجاح':(d.error||'فشل الرفع');input.value='';loadFiles()}async function del(name){if(!confirm('حذف الملف؟'))return;const r=await api('/api/files/'+name,{method:'DELETE'});if(r.ok)loadFiles();else{const d=await r.json();msg.textContent=d.error||'فشل الحذف'}}function logout(){localStorage.removeItem('moonSatToken');localStorage.removeItem('moonSatUser');location.href='/'}function format(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}check();loadFiles();</script></body></html>
