<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moon Sat — دخول المالك</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(420px,90%);background:#121a33;border:1px solid #29365e;border-radius:20px;padding:26px;box-sizing:border-box}h1{text-align:center;margin:0 0 8px}.sub{text-align:center;color:#aeb9d6;margin-bottom:24px}label{display:block;margin:14px 0 7px}input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #3a4a78;background:#0b1020;color:#fff}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#4f7cff;color:#fff;font-weight:bold}#error{color:#ff8799;text-align:center;margin-top:12px;display:none}</style></head><body><div class="card"><h1>🌙 Moon Sat</h1><div class="sub">دخول المالك الرئيسي</div><form onsubmit="login(event)"><label>اسم المستخدم</label><input id="user" autocomplete="username" required><label>كلمة المرور</label><input id="pass" type="password" autocomplete="current-password" required><button>دخول لوحة التحكم</button><div id="error"></div></form></div><script>async function login(e){e.preventDefault();const error=document.getElementById('error');error.style.display='none';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.value,password:pass.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'فشل تسجيل الدخول');localStorage.setItem('moonSatToken',d.token);localStorage.setItem('moonSatUser',d.username);location.href='/dashboard.html'}catch(x){error.textContent=x.message;error.style.display='block'}}</script></body></html>
